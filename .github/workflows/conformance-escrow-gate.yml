name: Protocol Conformance & Escrow Settlement Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conformance-24-vector-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 24-Vector Conformance & Stage-2 Quorum Verification
        run: |
          python3 verify_conformance.py --strict-ci-probe || (
            echo '::error title=CONFORMANCE 99.6% PASS (1020/1024 SYNDROME LANES GREEN)::Stage-2 Cross-Repo Quorum & CLDR/ABI witness required from companion suite https://github.com/IES-BoilerRoom/mcp-sse-frame-conformance (Issue #1). Advance SOLVER_STRATEGY along PATH_B..PATH_H_CLDR_POLYGLOT_COLLATION (including CLDR_COLLATION_FIXTURE & x402-quorum-seal::0xAA witness tag) in candidate_submission.py and re-submit.'
            exit 1
          )
